        <h1>بيانات التسجيل</h1>
        <p>سنقوم بطرح بعض الأسئلة التي يتوجب عليك الإجابة عليها جميعاً</p>
        <form action="">
        <div class="inputing">
     <div class="ldiv">
            <div>
             <label for="name">الاسم كاملاً</label>
             <input type="text" id="name" placeholder="أدخل الاسم كاملاً..."required>
           </div>
           <div>
             <label for="phone">رقم التواصل</label>
            <input type="text" id="phone" placeholder="أدخل رقم التواصل..."required>
        </div>
        <div>
            <label for="specialization">التخصص</label>
            <input type="text" id="specialization" placeholder="أدخل التخصص..."required>
        </div>
        <div>
           <label for="job">المسمى الوظيفي</label>
           <input type="text" id="job" placeholder="أدخل المسمى الوظيفي..."required>
        </div>
        <div>
           <label for="city">المدينة</label>
          <input type="text" id="city" placeholder="أدخل  المدينةً..."required>
        </div>
      </div>
        <div class="rdiv">
             <div>
             <label for="email">البريد الإلكتروني</label>
             <input type="email" id="email" placeholder="أدخل البريد الإلكتروني..."required>
           </div>
           <div>
             <label for="mark">الدرجة العلمية</label>
            <input type="text" id="mark" placeholder="أدخل الدرجة العلمية..."required>
        </div>
        <div>
            <label for="placeWork">مكان العمل </label>
            <input type="text" id="placeWork" placeholder="أدخل مكان العمل ..."required>
        </div>
        <div>
           <label for="place"> المنطقة</label>
           <input type="text" id="place" placeholder="أدخل المنطقة..."required>
        </div>
        <div>
           <label for="certificates">الشهادات والدورات</label>
          <input type="file" id="certificates" required>
        </div>
        </div>
    </div>
    <button type="submit">حفظ</button>
