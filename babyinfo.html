    <section id="form1">
        <div class="img"><img src="image/personal-information.png" alt="">
        <h2><span>بيانات </span>أساسية </h2>
        </div>

        <form action="">

          <div class="name">
          <label for="name">الاسم كاملا</label>
          <input type="text" id="name" required placeholder="أدخل الاسم كاملاً...">
        </div>

         <div class="id">
          <label for="id">رقم الهوية</label>
          <input type="text" id="id" required placeholder="أدخل رقم الهوية...">
        </div>

        <div class="date">
        <label for="date">تاريخ الميلاد</label>
        <input type="date" id="date" required style="color: #3cbabc;font-size: 15px;">
        </div>

        <div class="placeBrith">
          <label for="placeBrith">مكان الميلاد</label>
          <input type="text" id="placeBrith" required placeholder="أدخل مكان الميلاد...">
        </div>

        <div class="gender">
          <label for="gender">الجنس</label>
          <select id="gender">
            <option value="1">اختر الجنس...</option>
            <option value="2">ذكر</option>
            <option value="3">أنثى</option>
        </select>
        </div>

        <div class="nationality">
          <label for="nationality">الجنسية</label>
           <select id="nationality">
            <option value="1">اختر الجنسية...</option>
            <option value="2">فلسطيني/ ية</option>
            <option value="3">يمني/ ية</option>
            <option value="4">مصري/ ية</option>
           </select>
        </div>

        <div class="housingArea">
          <label for="housingArea">مكان السكن</label>
           <select id="housingArea">
            <option value="1">اختر مكان السكن...</option>
            <option value="2">الشمال</option>
            <option value="3">الوسط</option>
            <option value="4">الجنوب</option>
           </select>
        </div>

        <div class="city">
         <label for="city">المدينة</label>
           <select id="city">
            <option value="1">اختر المدينة...</option>
            <option value="2">الشمال</option>
            <option value="3">غزة</option>
            <option value="4">الوسطى</option>
            <option value="5">خانيونس</option>
            <option value="6">رفح</option>
           </select>
        </div>
        </form>
                
    </section>

     <section id="form2">
        <div class="img">
           <img src="image/medical1.png" alt="">
           <h2><span>بيانات </span>صحية</h2>
        </div>

                <label class="la2">هل لدى الطفل إعاقات أخرى</label>

                </div>
              </div>
             <div class="div3">
                <label class="la3">هل لدى الطفل أمراض مزمنة</label>
                <div class="radio">
                  <input type="radio" name="div3">
                  <label>نعم</label>
                  <input type="radio" name="div3">
                  <label>لا</label>
                </div>
             </div>
             <div class="div4">
                <label class="la4">هل لدى الطفل أمراض وراثية</label>

                  <input type="radio" name="div4">
                  <label>نعم</label>
                  <input type="radio" name="div4">

                </div>
             </div>
             <div class="div5">
                <label class="la5">هل لدى الطفل مشاكل صحية أخرى</label>
                <div class="radio">
                  <input type="radio" name="div5">
                  <label>نعم</label>
                  <input type="radio" name="div5">
                  <label>لا</label>
                </div>
             </div>
             <div class="div6">
                <label class="la6">هل مراحل النمو عند الطفل طبيعية منذ الولادة</label>
                <div class="radio">
                  <input type="radio" name="div6">
                  <label>نعم</label>
                  <input type="radio" name="div6">
                  <label>لا</label>
                </div>
             </div> 
        </form>

        <div class="button">
        <button type="submit">حفظ البيانات</button>
        </div>
