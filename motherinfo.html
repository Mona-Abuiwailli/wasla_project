    <section id="form1">
        <div class="img"><img src="image/personal-information.png" alt="">
        <h2><span>بيانات </span>أساسية </h2>
        </div>

        <form action="">

          <div class="name">
          <label for="name">الاسم كاملا</label>
          <input type="text" id="name" required placeholder="أدخل الاسم كاملاً...">
        </div>

         <div class="id">
          <label for="id">رقم الهوية</label>
          <input type="text" id="id" required placeholder="أدخل رقم الهوية...">
        </div>

        <div class="date">
        <label for="date">تاريخ الميلاد</label>
        <input type="date" id="date" required style="color: #3cbabc;font-size: 15px;">
        </div>
        <div class="socialStatus">
          <label for="socialStatus">الحالة الإجتماعية</label>
            <select id="socialStatus">
            <option value="1">اختر الحالة الإجتماعية...</option>
            <option value="2">متزوجة</option>
            <option value="3">مطلقة</option>
            <option value="4">أرملة</option>
        </select>
        </div>
        <div class="number">
          <label for="number">رقم التواصل</label>
          <input type="text" id="number" placeholder="أدخل رقم التواصل..." required>
        </div>
        <div class="EductionLevel">
          <label for="EductionLevel">المستوى التعليمي</label>
            <select id="EductionLevel">
            <option value="1">اختر المستوى التعليمي...</option>
            <option value="2">دبلوم</option>
            <option value="3">بكالوريوس</option>
            <option value="4">ماجستير</option>
            <option value="5">دكتوراه</option>
            <option value="6">غير متعلمة</option>
        </select>
        </div>
        <div class="workNature">
          <label for="workNature">طبيعة العمل</label>
          <select id="workNature">
            <option value="1">اختر طبيعة العمل...</option>
            <option value="2">موظفة رسمية</option>
            <option value="3">موظفة يومية</option>
            <option value="4">متقاعدة</option>
            <option value="5">ربة منزل</option>
        </select>
        </div>
        </form>
    </section>

    <section id="form2">
        <div class="img">
           <img src="image/medical1.png" alt="">
           <h2><span>بيانات </span>صحية</h2>
        </div>
        <form action="">
              <div class="div2">
                <label class="la2">هل الأم مدخنة</label>
                <div class="radio">
                  <input type="radio" name="div2">
                  <label>نعم</label>
                  <input type="radio" name="div2">
                  <label>لا</label>
                </div>
              </div>
             <div class="div3">
                <label class="la3">هل لدى الأم إعاقة</label>
                <div class="radio">
                  <input type="radio" name="div3">
                  <label>نعم</label>
                  <input type="radio" name="div3">
                  <label>لا</label>
                </div>
             </div>
             <div class="div4">
                <label class="la4">هل تعاني الأم من أمراض مزمنة</label>
                <div class="radio">
                  <input type="radio" name="div4">
                  <label>نعم</label>
                  <input type="radio" name="div4">
                  <label>لا</label>
                </div>
             </div>
             <div class="div5">
                <label class="la5">هل تعاني الأم من أمراض وراثية</label>
                <div class="radio">
                  <input type="radio" name="div5">
                  <label>نعم</label>
                  <input type="radio" name="div5">
                  <label>لا</label>
                </div>
             </div>
             <div class="div6">
                <label class="la6">هل تعاني الأم من مشاكل صحية أخرى</label>
                <div class="radio">
                  <input type="radio" name="div6">
                  <label>نعم</label>
                  <input type="radio" name="div6">
                  <label>لا</label>
                </div>
             </div> 
             <div class="div7">
                <label class="la7">ما هي الحالة النفسية للأم</label>
                <div class="radio">
                  <input type="radio" name="div7">
                  <label>طبيعية</label>
                  <input type="radio" name="div7">
                  <label>تعاني من مشاكل نفسية</label>
                </div>
             </div>
             <div class="div8">
                <label class="la8">ما هي درجة تواصل الأم مع الطفل</label>
                <div class="radio">
                  <input type="radio" name="div8">
                  <label>قوية</label>
                  <input type="radio" name="div8">
                  <label>متوسطة</label>
                  <input type="radio" name="div8">
                  <label>ضعيفة</label>
                </div>
             </div>
        </form>

        <div class="button">
        <button type="submit">حفظ البيانات</button>
        </div> 
     </section>
